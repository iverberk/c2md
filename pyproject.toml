[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c2md"
version = "0.1.0"
description = "Convert Confluence Data Center pages to Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1"]

[project.optional-dependencies]
keyring = ["keyring>=25,<27"]

[project.scripts]
c2md = "c2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/c2md"]
